randomized_search:
  class: RandomizedSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 3
    n_jobs: -1
    n_iter: 15
    scoring: neg_root_mean_squared_error
    random_state: 42

model_selection:

  module_0:
    class: LinearRegression
    module: sklearn.linear_model
    params: {}
    search_param_distributions: {}

  module_1:
    class: Ridge
    module: sklearn.linear_model
    params:
      alpha: 1.0
    search_param_distributions:
      alpha:
        - 0.001
        - 0.01
        - 0.1
        - 1.0
        - 10.0
        - 100.0

  module_2:
    class: Lasso
    module: sklearn.linear_model
    params:
      alpha: 1.0
      max_iter: 5000
    search_param_distributions:
      alpha:
        - 0.0001
        - 0.001
        - 0.01
        - 0.1
        - 1.0
        - 10.0
      max_iter:
        - 5000
        - 10000

  module_3:
    class: SVR
    module: sklearn.svm
    params:
      kernel: rbf
      C: 1.0
      epsilon: 0.1
    search_param_distributions:
      kernel:
        - rbf
        - linear
        - poly
      C:
        - 0.1
        - 1.0
        - 10.0
        - 100.0
      epsilon:
        - 0.01
        - 0.05
        - 0.1
        - 0.2
        - 0.5
      gamma:
        - scale
        - auto
      degree:
        - 2
        - 3

  module_4:
    class: KNeighborsRegressor
    module: sklearn.neighbors
    params:
      n_neighbors: 5
    search_param_distributions:
      n_neighbors:
        - 3
        - 5
        - 7
        - 9
        - 11
        - 15
        - 20
      weights:
        - uniform
        - distance
      algorithm:
        - auto
        - ball_tree
        - kd_tree
        - brute
      leaf_size:
        - 20
        - 30
        - 40
      p:
        - 1
        - 2

  module_5:
    class: RandomForestRegressor
    module: sklearn.ensemble
    params:
      n_estimators: 200
      max_depth: null
      random_state: 42
      n_jobs: -1
    search_param_distributions:
      n_estimators:
        - 100
        - 200
        - 300
        - 500
      max_depth:
        - null
        - 5
        - 10
        - 15
        - 20
      min_samples_split:
        - 2
        - 5
        - 10
      min_samples_leaf:
        - 1
        - 2
        - 4
      max_features:
        - sqrt
        - log2
        - 1.0
      bootstrap:
        - true
        - false

  module_6:
    class: HistGradientBoostingRegressor
    module: sklearn.ensemble
    params:
      max_iter: 200
      learning_rate: 0.05
      random_state: 42
    search_param_distributions:
      max_iter:
        - 100
        - 200
        - 300
        - 500
      learning_rate:
        - 0.01
        - 0.03
        - 0.05
        - 0.1
        - 0.2
      max_leaf_nodes:
        - 15
        - 31
        - 63
      max_depth:
        - null
        - 5
        - 10
      min_samples_leaf:
        - 5
        - 10
        - 20
        - 30
      l2_regularization:
        - 0.0
        - 0.1
        - 1.0
        - 10.0

  module_7:
    class: AdaBoostRegressor
    module: sklearn.ensemble
    params:
      n_estimators: 200
      learning_rate: 0.05
      random_state: 42
    search_param_distributions:
      n_estimators:
        - 50
        - 100
        - 200
        - 300
        - 500
      learning_rate:
        - 0.01
        - 0.03
        - 0.05
        - 0.1
        - 0.2
        - 0.5
      loss:
        - linear
        - square
        - exponential

  module_8:
    class: XGBRegressor
    module: xgboost
    params:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
    search_param_distributions:
      n_estimators:
        - 100
        - 200
        - 300
        - 500
        - 800
      learning_rate:
        - 0.01
        - 0.03
        - 0.05
        - 0.1
        - 0.2
      max_depth:
        - 3
        - 4
        - 5
        - 6
        - 8
      min_child_weight:
        - 1
        - 3
        - 5
        - 10
      subsample:
        - 0.6
        - 0.7
        - 0.8
        - 0.9
        - 1.0
      colsample_bytree:
        - 0.6
        - 0.7
        - 0.8
        - 0.9
        - 1.0
      gamma:
        - 0
        - 0.01
        - 0.1
        - 0.3
        - 0.5
      reg_alpha:
        - 0
        - 0.01
        - 0.1
        - 1.0
        - 10.0
      reg_lambda:
        - 1.0
        - 5.0
        - 10.0
        - 20.0